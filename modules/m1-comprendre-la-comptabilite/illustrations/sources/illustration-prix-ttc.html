<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><style>
:root{
  --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0; --g300:#cbd5e1; --g400:#94a3b8;
  --g500:#64748b; --g600:#475569; --g700:#334155; --g800:#1e293b; --g900:#0f172a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,"Segoe UI",sans-serif;background:#fff;color:var(--g900)}
.img{width:100%;max-width:720px;padding:22px 24px 22px;background:#fff}
.titre{font-size:.63rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--g500)}
.mt{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Deux lectures du même prix, sur la même longueur.
   Les colonnes portent les montants : 10 + 2 = 12, la proportion est exacte. */
.schema{margin-top:16px;display:grid;grid-template-columns:max-content 10fr 2fr;column-gap:0;row-gap:0;align-items:center}
.qui{padding-right:16px;font-size:.78rem;font-weight:700;color:var(--g800);line-height:1.25}
.qui span{display:block;font-size:.66rem;font-weight:400;color:var(--g500)}
.barre{height:56px;display:flex;flex-direction:column;justify-content:center;padding:0 12px}
.barre .m{font-size:1.15rem;font-weight:800}
.barre .n{font-size:.68rem;line-height:1.2}
.r1{grid-row:1} .r2{grid-row:3}
.ttc{grid-column:2/4;background:var(--g800);color:#fff;border-radius:8px;text-align:center}
.ttc .n{color:var(--g300)}
.ht{grid-column:2;background:var(--g800);color:#fff;border-radius:8px 0 0 8px}
.ht .n{color:var(--g300)}
.taxe{grid-column:3;background:var(--g200);color:var(--g900);border-left:2px solid #fff;border-radius:0 8px 8px 0;padding:0 8px;text-align:center}
.taxe .n{color:var(--g700)}

/* entre les deux barres, le même prix, rien d'ajouté */
.meme{grid-row:2;grid-column:2/4;height:26px;display:flex;justify-content:space-between;padding:0 1px}
.meme i{display:block;width:0;height:100%;border-left:1.5px dashed var(--g300)}

/* sous la seconde barre, où va chaque part */
.dest{grid-row:4;padding-top:6px;text-align:center}
.dest::before{content:"";display:block;width:2px;height:14px;margin:0 auto;background:var(--g400)}
.dest::after{content:"";display:block;width:0;margin:-1px auto 0;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--g400)}
.dest p{order:2;margin-top:4px;font-size:.8rem;font-weight:700;color:var(--g900)}
.dest{display:flex;flex-direction:column;align-items:center}
.dest::after{order:1}
.d-ht{grid-column:2}
.d-taxe{grid-column:3}

@media (max-width:640px){
  .img{padding:18px 14px 16px}
  .schema{grid-template-columns:10fr 2fr}
  .qui{grid-column:1/3;padding:0 0 5px}
  .r1{grid-row:2} .meme{grid-row:3} .r2{grid-row:5} .dest{grid-row:6}
  .qui.q1{grid-row:1} .qui.q2{grid-row:4}
  .qui span{display:inline;margin-left:6px}
  .dest p{white-space:nowrap}
  .ttc{grid-column:1/3} .meme{grid-column:1/3}
  .ht,.d-ht{grid-column:1} .taxe,.d-taxe{grid-column:2}
  .meme{height:18px}
  .barre{height:52px;padding:0 10px}
  .taxe{padding:0 4px}
  .barre .m{font-size:1rem}
  .barre .n{font-size:.6rem}
  .dest p{font-size:.72rem}
}
</style></head><body>
<div class="img" id="img">
  <p class="titre">Un sachet de café, au comptoir</p>

  <div class="schema">
    <p class="qui q1 r1">Le client<span>voit un prix</span></p>
    <div class="barre ttc r1"><p class="m mt">12&nbsp;€</p><p class="n">toutes taxes comprises</p></div>

    <div class="meme"><i></i><i></i></div>

    <p class="qui q2 r2">Latitude Café<span>lit deux montants</span></p>
    <div class="barre ht r2"><p class="m mt">10&nbsp;€</p><p class="n">hors taxes, le prix de son café</p></div>
    <div class="barre taxe r2"><p class="m mt">2&nbsp;€</p><p class="n">de taxe</p></div>

    <div class="dest d-ht"><p>pour Latitude Café</p></div>
    <div class="dest d-taxe"><p>pour l’État</p></div>
  </div>
</div>
</body></html>
