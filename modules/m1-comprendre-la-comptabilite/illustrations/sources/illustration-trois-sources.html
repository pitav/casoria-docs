<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<!-- Icônes : Material Design Icons (mdi:cash-multiple, mdi:account-tie, mdi:bank),
     licence Apache 2.0, via icones.js.org / @iconify-json/mdi. -->
<style>
:root{
  --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0; --g300:#cbd5e1; --g400:#94a3b8;
  --g500:#64748b; --g600:#475569; --g700:#334155; --g800:#1e293b; --g900:#0f172a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,"Segoe UI",sans-serif;background:#fff;color:var(--g900)}
.img{width:100%;max-width:720px;padding:22px 24px 20px;background:#fff}
.titre{font-size:.63rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--g500)}

/* Trois sources en colonnes, trois lectures en rangées.
   Les intitulés de rangée ne s'écrivent qu'une fois, à gauche. */
.tab{margin-top:14px;display:grid;grid-template-columns:max-content repeat(3,1fr);column-gap:16px}
.src{grid-row:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:12px}
.src svg{display:block;width:52px;height:52px;color:var(--g700)}
.src p{margin-top:4px;font-size:.84rem;font-weight:700;color:var(--g900)}
.lab{grid-column:1;display:flex;align-items:center;border-top:1.5px solid var(--g200);padding:10px 0;
  font-size:.62rem;font-weight:800;letter-spacing:.06em;line-height:1.35;text-transform:uppercase;color:var(--g700);white-space:nowrap}
.cell{border-top:1.5px solid var(--g200);padding:10px 0;display:flex;align-items:center;justify-content:center}
.c1{grid-column:2} .c2{grid-column:3} .c3{grid-column:4}
.r1{grid-row:2} .r2{grid-row:3} .r3{grid-row:4}

/* les deux jauges : trois marches, sans chiffre — c'est un ordre, pas une mesure */
.jauge{display:flex;gap:4px}
.jauge i{display:block;width:26px;height:12px;border-radius:2px;background:var(--g200)}
.jauge i.on{background:var(--g700)}
.cell .t{font-size:.86rem;font-weight:600;line-height:1.3;text-align:center;color:var(--g900);text-wrap:balance}

/* sous le tout, le sens de lecture */
.sens{grid-row:5;grid-column:2/5;margin-top:6px;position:relative;height:12px}
.sens::before{content:"";position:absolute;left:0;right:6px;top:5px;height:2px;background:var(--g400)}
.sens::after{content:"";position:absolute;right:0;top:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid var(--g400)}

@media (max-width:640px){
  .bl{display:none}
  .img{padding:18px 14px 16px}
  .tab{grid-template-columns:repeat(3,1fr);column-gap:8px}
  .c1{grid-column:1} .c2{grid-column:2} .c3{grid-column:3}
  .src svg{width:38px;height:38px}
  .src p{font-size:.72rem}
  .lab{grid-column:1/4;justify-content:center;padding:9px 0 2px;border-top:1.5px solid var(--g200)}
  .cell{border-top:0;padding:6px 0 10px}
  .lab.r1{grid-row:2} .cell.r1{grid-row:3}
  .lab.r2{grid-row:4} .cell.r2{grid-row:5}
  .lab.r3{grid-row:6} .cell.r3{grid-row:7}
  .sens{grid-row:8;grid-column:1/4}
  .jauge{gap:3px}
  .jauge i{width:18px;height:10px}
  .cell .t{font-size:.72rem}
}
</style></head><body>
<div class="img" id="img">
  <p class="titre">Trois façons de financer le torréfacteur</p>
  <div class="tab">
    <div class="src c1"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 6h18v12H5zm9 3a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3M9 8a2 2 0 0 1-2 2v4a2 2 0 0 1 2 2h10a2 2 0 0 1 2-2v-4a2 2 0 0 1-2-2zm-8 2h2v10h16v2H1z"/></svg><p>Sa trésorerie</p></div>
    <div class="src c2"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3c2.21 0 4 1.79 4 4s-1.79 4-4 4s-4-1.79-4-4s1.79-4 4-4m4 10.54c0 1.06-.28 3.53-2.19 6.29L13 15l.94-1.88c-.62-.07-1.27-.12-1.94-.12s-1.32.05-1.94.12L11 15l-.81 4.83C8.28 17.07 8 14.6 8 13.54c-2.39.7-4 1.96-4 3.46v4h16v-4c0-1.5-1.6-2.76-4-3.46"/></svg><p>Un associé</p></div>
    <div class="src c3"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.5 1L2 6v2h19V6m-5 4v7h3v-7M2 22h19v-3H2m8-9v7h3v-7m-9 0v7h3v-7z"/></svg><p>Une banque</p></div>

    <p class="lab r1">Ce qu’elle<br class="bl"> reçoit</p>
    <div class="cell c1 r1"><span class="jauge"><i class="on"></i><i></i><i></i></span></div>
    <div class="cell c2 r1"><span class="jauge"><i class="on"></i><i class="on"></i><i></i></span></div>
    <div class="cell c3 r1"><span class="jauge"><i class="on"></i><i class="on"></i><i class="on"></i></span></div>

    <p class="lab r2">Ce qui<br class="bl"> l’engage</p>
    <div class="cell c1 r2"><span class="jauge"><i class="on"></i><i></i><i></i></span></div>
    <div class="cell c2 r2"><span class="jauge"><i class="on"></i><i class="on"></i><i></i></span></div>
    <div class="cell c3 r2"><span class="jauge"><i class="on"></i><i class="on"></i><i class="on"></i></span></div>

    <p class="lab r3">Se<br class="bl"> rembourse</p>
    <div class="cell c1 r3"><p class="t">jamais</p></div>
    <div class="cell c2 r3"><p class="t">quand elle le peut</p></div>
    <div class="cell c3 r3"><p class="t">à dates fixes, avec intérêts</p></div>

    <span class="sens"></span>
  </div>
</div>
</body></html>
